<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Electric Vehicle Hub - Registration</title>
<link rel="stylesheet" href="csslab.css">
</head>
<body>

<header>
    <h1>Register for EV Updates</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="vehicles.html">Vehicles</a>
    <a href="register.html" class="active">Register</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
</nav>

<main>
    <h2>Sign Up</h2>
    <p>Fill in your details below to receive the latest EV news and offers.</p>

    <form>
        <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone">
        </div>

        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
        </div>

        <div class="radio-group">
            <label><input type="radio" name="gender"> Male</label>
            <label><input type="radio" name="gender"> Female</label>
        </div>

        <div class="checkbox-group">
            <label><input type="checkbox"> Subscribe to newsletter</label>
        </div>

        <input type="submit" value="Register">
    </form>
</main>

<footer>
    <p>&copy; 2026 Electric Vehicle Hub | Nairobi, Kenya</p>
</footer>

</body>
</html>
